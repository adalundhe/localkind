# hyper-light/hyperlight-site — Next.js 16 / React 19 / TypeScript. CI only.
# Upstream has no CI; deployment is the Vercel GitHub integration, which this does not touch.
# Jobs follow the README's order (lint, typecheck, test, build) but run independently, so one
# red check does not hide the others. Not ported: Playwright e2e (needs browsers + a dev server).

resources:
- name: repo
  type: git
  icon: github
  check_every: 2m
  source:
    uri: https://github.com/hyper-light/hyperlight-site.git
    branch: main

- name: node-image
  type: registry-image
  icon: docker
  check_every: 24h            # pinned tag; fetched as a resource so a flaky pull can be retried
  source: {repository: node, tag: "24-slim"}

jobs:
- name: lint
  build_log_retention: {builds: 30}
  plan:
  - in_parallel:
    - get: repo
      trigger: true
      attempts: 3
    - get: node-image
      attempts: 3
  - task: eslint-prettier
    image: node-image
    timeout: 20m
    config: &node-task
      platform: linux
      inputs:
      - name: repo
      caches:
      - path: npm-cache
      params:
        CI: "true"
        NEXT_TELEMETRY_DISABLED: "1"
      run:
        path: bash
        args:
        - -euc
        - |
          export npm_config_cache="$PWD/npm-cache" npm_config_update_notifier=false
          cd repo
          set -x
          npm ci --no-audit --no-fund
          npm run lint
          npm run format:check

- name: test
  build_log_retention: {builds: 30}
  plan:
  - in_parallel:
    - get: repo
      trigger: true
      attempts: 3
    - get: node-image
      attempts: 3
  - task: typecheck-and-unit
    image: node-image
    timeout: 30m
    config:
      <<: *node-task
      run:
        path: bash
        args:
        - -euc
        - |
          export npm_config_cache="$PWD/npm-cache" npm_config_update_notifier=false
          cd repo
          set -x
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test

- name: build
  build_log_retention: {builds: 30}
  plan:
  - in_parallel:
    - get: repo
      trigger: true
      attempts: 3
    - get: node-image
      attempts: 3
  - task: next-build
    image: node-image
    timeout: 30m
    config:
      <<: *node-task
      run:
        path: bash
        args:
        - -euc
        - |
          export npm_config_cache="$PWD/npm-cache" npm_config_update_notifier=false
          cd repo
          set -x
          npm ci --no-audit --no-fund
          npm run build
