# hyper-light/slates — Rust workspace, Dockerfile at the repo root, chart at deploy/helm/slates.
#
#   lint ─┐
#   test ─┴─(gate)─> publish: version -> image -> docker.io/((docker_user))/slates
#                                              -> chart -> oci://registry-1.docker.io/((docker_user))/slates-chart
#                             Argo CD (argocd/apps/slates.yaml) then rolls out the new chart version.
#
# Mirrors the Linux half of .github/workflows/ci.yml `gates`. Not ported, by necessity:
#   macOS/Windows jobs, `conformance` (needs root NFS mounts + strace) and the `kind` lane (needs
#   a Docker daemon and its own kind cluster).
# helm is deliberately absent from the task image: the chart golden tests pin helm v4.3.0 and
# skip cleanly when helm is not on PATH (an unpinned helm renders different whitespace and fails).

resources:
- name: repo
  type: git
  icon: github
  check_every: 2m
  source:
    uri: https://github.com/hyper-light/slates.git
    branch: main

- name: localkind
  type: git
  icon: cog
  check_every: 10m
  source:
    uri: https://github.com/adalundhe/localkind.git
    branch: main
    paths: [ci]

- name: image
  type: registry-image
  icon: docker
  check_every: never          # write-only from here; Argo CD is the consumer
  source:
    repository: ((docker_user))/slates
    tag: latest
    username: ((docker.username))
    password: ((docker.password))

- name: rust-image
  type: registry-image
  icon: docker
  check_every: 24h            # pinned tag; fetched as a resource so a flaky pull can be retried
  source: {repository: rust, tag: "1.98.0"}

- name: alpine-image
  type: registry-image
  icon: docker
  check_every: 24h            # pinned tag; fetched as a resource so a flaky pull can be retried
  source: {repository: alpine, tag: "3.22"}

- name: oci-build-task-image
  type: registry-image
  icon: docker
  check_every: 24h
  source: {repository: concourse/oci-build-task}

jobs:
# serial_groups: one cargo job at a time per pipeline. Three concurrent LTO builds would fight over
# the same worker's CPU/RAM budget and make the timing-sensitive tests flakier than they already are.
- name: lint
  serial_groups: [cargo]
  build_log_retention: {builds: 30}
  plan:
  - in_parallel:
    - get: repo
      trigger: true
      attempts: 3
    - get: rust-image
      attempts: 3
  - task: lint
    image: rust-image
    timeout: 45m
    config: &rust-task          # shared by the test job below (it overrides `run`)
      platform: linux
      inputs:
      - name: repo
      caches:
      - path: cargo-home
      - path: target
      params:
        CARGO_TERM_COLOR: always
      run:
        path: bash
        args:
        - -euc
        - |
          export CARGO_HOME="$PWD/cargo-home" CARGO_TARGET_DIR="$PWD/target"
          cd repo
          set -x
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo xtask structural
          cargo xtask literals
          cargo xtask version

- name: test
  serial_groups: [cargo]
  build_log_retention: {builds: 30}
  plan:
  - in_parallel:
    - get: repo
      trigger: true
      attempts: 3
    - get: rust-image
      attempts: 3
  - task: test
    image: rust-image
    timeout: 1h30m
    config:
      <<: *rust-task
      run:
        path: bash
        args:
        - -euc
        - |
          export CARGO_HOME="$PWD/cargo-home" CARGO_TARGET_DIR="$PWD/target"
          cd repo
          set -x
          # --no-fail-fast: upstream stops at the first failing test binary, hiding the rest.
          cargo test --workspace --no-fail-fast
          cargo test -p slates-vfs --release --test model -- --ignored ac_1_1
          SLATES_TEST_CLI=1 cargo test -p slates-cli --test cli -- --test-threads=1 --nocapture

- name: publish
  serial: true
  serial_groups: [cargo]
  build_log_retention: {builds: 30}
  plan:
  - in_parallel:
    - get: repo
      trigger: true
      attempts: 3
      # GATE. `[]` publishes every commit on main; `[lint, test]` publishes only green commits.
      # Open as of 2026-09-19 because main is red upstream (a different timing-sensitive test
      # fails each run, e.g. crates/server/tests/recovery.rs) and nothing would ever deploy.
      passed: []
    - get: localkind
      attempts: 3
    - get: alpine-image
      attempts: 3
    - get: oci-build-task-image
      attempts: 3
  - task: version
    image: alpine-image
    file: localkind/ci/tasks/version.yml
    params:
      VERSION_FILE: Cargo.toml
      SOURCE_URL: https://github.com/hyper-light/slates
  - task: build-image
    image: oci-build-task-image
    privileged: true
    timeout: 1h
    file: localkind/ci/tasks/build-image.yml
    params:
      DOCKERFILE: repo/Dockerfile
  - put: image
    attempts: 3
    inputs: [image, version]
    params:
      image: image/image.tar
      additional_tags: version/tags
    get_params: {skip_download: true}
  - task: publish-chart
    image: alpine-image
    file: localkind/ci/tasks/publish-chart.yml
    params:
      CHART_PATH: deploy/helm/slates
      CHART_NAME: slates-chart
      IMAGE_REPOSITORY: ((docker_user))/slates
      # nameOverride keeps labels/resource names identical to the un-renamed chart.
      VALUES_EXPR: >-
        .image.repository = strenv(IMAGE_REPOSITORY) |
        .image.tag = strenv(VERSION) |
        .image.pullPolicy = "IfNotPresent" |
        .nameOverride = "slates"
      REGISTRY_NAMESPACE: ((docker_user))
      REGISTRY_USERNAME: ((docker.username))
      REGISTRY_PASSWORD: ((docker.password))
