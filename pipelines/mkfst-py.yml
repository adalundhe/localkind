# hyper-light/mkfst-py — Python (pip + setuptools). CI only.
# Mirrors .github/workflows/ci.yml: lint, test, build (build needs both, as upstream).
# Upstream's matrix is py3.11–3.14 x {ubuntu, macos}; this runs the primary target, py3.13 on linux.

resources:
- name: repo
  type: git
  icon: github
  check_every: 2m
  source:
    uri: https://github.com/hyper-light/mkfst-py.git
    branch: main

- name: python-image
  type: registry-image
  icon: docker
  check_every: 24h            # pinned tag; fetched as a resource so a flaky pull can be retried
  source: {repository: python, tag: "3.13-slim"}

jobs:
- name: lint
  build_log_retention: {builds: 30}
  plan:
  - in_parallel:
    - get: repo
      trigger: true
      attempts: 3
    - get: python-image
      attempts: 3
  - task: ruff
    image: python-image
    timeout: 20m
    config: &py-task
      platform: linux
      inputs:
      - name: repo
      caches:
      - path: pip-cache
      run:
        path: bash
        args:
        - -euc
        - |
          export PIP_CACHE_DIR="$PWD/pip-cache" PIP_DISABLE_PIP_VERSION_CHECK=1 PIP_ROOT_USER_ACTION=ignore
          cd repo
          set -x
          python -m pip install -q -e ".[dev,auth]"
          ruff check .
          ruff format --check \
            mkfst/encryption mkfst/middleware/csrf mkfst/middleware/cors mkfst/middleware/auth \
            mkfst/snowflake mkfst/connection/tcp/protocols/http_parser.py tests/

- name: test
  build_log_retention: {builds: 30}
  plan:
  - in_parallel:
    - get: repo
      trigger: true
      attempts: 3
    - get: python-image
      attempts: 3
  - task: pytest
    image: python-image
    timeout: 30m
    config:
      <<: *py-task
      run:
        path: bash
        args:
        - -euc
        - |
          export PIP_CACHE_DIR="$PWD/pip-cache" PIP_DISABLE_PIP_VERSION_CHECK=1 PIP_ROOT_USER_ACTION=ignore
          cd repo
          set -x
          python -m pip install -q -e ".[dev,auth]"
          pytest -q --tb=short

- name: build
  build_log_retention: {builds: 30}
  plan:
  - in_parallel:
    - get: repo
      trigger: true
      attempts: 3
      passed: [lint, test]
    - get: python-image
      attempts: 3
  - task: build-and-check
    image: python-image
    timeout: 20m
    config:
      <<: *py-task
      run:
        path: bash
        args:
        - -euc
        - |
          export PIP_CACHE_DIR="$PWD/pip-cache" PIP_DISABLE_PIP_VERSION_CHECK=1 PIP_ROOT_USER_ACTION=ignore
          cd repo
          set -x
          python -m pip install -q build twine
          python -m build
          python -m twine check dist/*
